# Génère client/public/lyon-osm.json (données OpenStreetMap du Grand Lyon)
# sur les serveurs de GitHub, qui ont accès à l'API Overpass, et le publie
# sur la branche `osm-data` (fichier seul, historique écrasé à chaque fois).
# Sert au développement : les sessions sans accès à Overpass récupèrent les
# vraies données avec `git fetch origin osm-data`. Ne touche ni à la prod
# ni au VPS, qui génère son propre fichier.
name: Données OSM de Lyon

on:
  workflow_dispatch:
  # régénère dès que le script change sur la branche de prod (ou l'ancienne
  # branche de travail) : la carte suit les améliorations de fetch-osm.mjs
  push:
    branches: [claude/3d-arcade-map-vps-5v3opg, ccr-10d2d3e3-8jvu9z]
    paths: [tools/fetch-osm.mjs, .github/workflows/osm-data.yml]

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Télécharger OSM (Overpass)
        run: node tools/fetch-osm.mjs
      - name: Publier sur la branche osm-data
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir out
          cp client/public/lyon-osm.json out/
          cd out
          git init -q
          git checkout -q -b osm-data
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lyon-osm.json
          git commit -q -m "Données OSM du Grand Lyon ($(date -u +%F))"
          git push -f "https://x-access-token:${TOKEN}@github.com/${{ github.repository }}.git" osm-data
